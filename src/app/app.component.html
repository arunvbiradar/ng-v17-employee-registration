<div class="progress-wrapper">
  <div id="progress-bar-container">
    <ul>
      <li
        class="step step01"
        (click)="setActiveStep(step)"
        [ngClass]="step.stepName === activeStep.stepName ? 'active' : ''"
        *ngFor="let step of stepList"
      >
        <div class="step-inner">{{ step.stepName }}</div>
      </li>
    </ul>
    <div id="line">
      <div id="line-progress" [style.width.%]="formProgress"></div>
    </div>
    <!-- progress-bar-container -->
    <div id="progress-content-section">
      <div
        class="section-content step1 active"
        *ngIf="activeStep.stepName === 'Basic Details'"
      >
        <div class="row g-3">
          <div class="col-md-6">
            <label
              for="firstName"
              class="form-label text-body-secondary fw-semibold"
              >First Name</label
            >
            <input
              type="text"
              class="form-control"
              id="firstName"
              placeholder="Jane"
              required
            />
          </div>

          <div class="col-md-6">
            <label
              for="lastName"
              class="form-label text-body-secondary fw-semibold"
              >Last Name</label
            >
            <input
              type="text"
              class="form-control"
              id="lastName"
              placeholder="Doe"
              required
            />
          </div>

          <div class="col-md-6">
            <label
              for="email"
              class="form-label text-body-secondary fw-semibold"
              >Email</label
            >
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="jane.doe@example.com"
              required
            />
          </div>

          <div class="col-md-6">
            <label
              for="password"
              class="form-label text-body-secondary fw-semibold"
              >Password</label
            >
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Enter password"
              required
            />
          </div>

          <div class="col-md-6">
            <label
              for="designation"
              class="form-label text-body-secondary fw-semibold"
              >Designation</label
            >
            <input
              type="text"
              class="form-control"
              id="designation"
              placeholder="Enter designation"
              required
            />
          </div>

          <div class="col-md-6">
            <label
              for="phone"
              class="form-label text-body-secondary fw-semibold"
              >Phone Number</label
            >
            <input
              type="tel"
              class="form-control"
              id="phone"
              placeholder="(555) 000-0000"
            />
          </div>

          <div class="col-md-6">
            <label
              for="yearsExperience"
              class="form-label text-body-secondary fw-semibold"
              >Total years of experience</label
            >
            <input
              type="text"
              class="form-control"
              id="yearsExperience"
              placeholder="Enter total years of experience"
              required
            />
          </div>

          <div class="col-md-6">
            <label
              for="monthExperience"
              class="form-label text-body-secondary fw-semibold"
              >Total month of experience</label
            >
            <input
              type="text"
              class="form-control"
              id="monthExperience"
              placeholder="Enter total month of experience"
              required
            />
          </div>

          <div class="col-12">
            <label
              for="address"
              class="form-label text-body-secondary fw-semibold"
              >Address</label
            >
            <textarea
              class="form-control"
              id="address"
              rows="3"
              placeholder="1234 Main St"
            ></textarea>
          </div>

          <div class="col-md-6">
            <label for="city" class="form-label text-body-secondary fw-semibold"
              >City</label
            >
            <input
              type="text"
              class="form-control"
              id="city"
              required
              placeholder="Enter city"
            />
          </div>

          <div class="col-md-6">
            <label
              for="state"
              class="form-label text-body-secondary fw-semibold"
              >State</label
            >
            <input
              type="text"
              class="form-control"
              id="state"
              required
              placeholder="Enter state"
            />
          </div>

          <div class="col-md-6">
            <label
              for="country"
              class="form-label text-body-secondary fw-semibold"
              >Country</label
            >
            <input
              type="text"
              class="form-control"
              id="country"
              required
              placeholder="Enter country"
            />
          </div>

          <div class="col-md-6">
            <label
              for="pincode"
              class="form-label text-body-secondary fw-semibold"
              >Pincode</label
            >
            <input
              type="text"
              class="form-control"
              id="pincode"
              required
              placeholder="Enter pincode"
            />
          </div>
        </div>
      </div>
      <div
        class="section-content step2 active"
        *ngIf="activeStep.stepName === 'Skills'"
      >
        <div class="row g-3 align-items-end mb-4">
          <div class="col-md-3 fw-bold">Skill</div>
          <div class="col-md-3 fw-bold">Total Experience</div>
          <div class="col-md-3 fw-bold">Last Version</div>
          <div class="col-md-3 fw-bold">Actions</div>
        </div>
        <div class="row g-3 align-items-end border-top border-bottom pb-3">
          <div class="col-md-3">
            <input
              type="text"
              class="form-control"
              id="skill"
              placeholder="Enter skill"
            />
          </div>

          <div class="col-md-3">
            <input
              type="number"
              class="form-control"
              id="totalExperience"
              placeholder="Enter total experience"
            />
          </div>

          <div class="col-md-3">
            <input
              type="text"
              class="form-control"
              id="lastVersion"
              placeholder="Enter last version"
            />
          </div>

          <div class="col-md-3">
            <div class="d-flex gap-2">
              <button
                type="submit"
                class="btn btn-success w-100 d-inline-flex align-items-center justify-content-center gap-2"
              >
                <i class="fa-solid fa-floppy-disk"></i>
              </button>
              <button
                type="button"
                class="btn btn-danger w-100 d-inline-flex align-items-center justify-content-center gap-2"
              >
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        </div>
        <div class="text-center mt-4">
          <button
            type="button"
            class="btn btn-primary d-inline-flex align-items-center justify-content-center gap-2"
          >
            <i class="fa-solid fa-plus"></i> Add skill
          </button>
        </div>
      </div>
      <div
        class="section-content step3 active"
        *ngIf="activeStep.stepName === 'Experience'"
      >
        <div class="row g-3 align-items-end mb-4">
          <div class="col-md-2 fw-bold">Company</div>
          <div class="col-md-2 fw-bold">Start Date</div>
          <div class="col-md-2 fw-bold">End Date</div>
          <div class="col-md-2 fw-bold">Designation</div>
          <div class="col-md-2 fw-bold">Project</div>
          <div class="col-md-2 fw-bold">Actions</div>
        </div>
        <div class="row g-3 align-items-end border-top border-bottom pb-3">
          <div class="col-md-2">
            <input
              type="text"
              class="form-control"
              id="company"
              placeholder="Enter company"
            />
          </div>

          <div class="col-md-2">
            <input
              type="date"
              class="form-control"
              id="startDate"
              placeholder="Enter start date"
            />
          </div>

          <div class="col-md-2">
            <input
              type="date"
              class="form-control"
              id="endDate"
              placeholder="Enter end date"
            />
          </div>

          <div class="col-md-2">
            <input
              type="text"
              class="form-control"
              id="designation"
              placeholder="Enter designation"
            />
          </div>

          <div class="col-md-2">
            <input
              type="text"
              class="form-control"
              id="project"
              placeholder="Enter project"
            />
          </div>

          <div class="col-md-2">
            <div class="d-flex gap-2">
              <button
                type="submit"
                class="btn btn-success w-100 d-inline-flex align-items-center justify-content-center gap-2"
              >
                <i class="fa-solid fa-floppy-disk"></i>
              </button>
              <button
                type="button"
                class="btn btn-danger w-100 d-inline-flex align-items-center justify-content-center gap-2"
              >
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        </div>
        <div class="text-center mt-4">
          <button
            type="button"
            class="btn btn-primary d-inline-flex align-items-center justify-content-center gap-2"
          >
            <i class="fa-solid fa-plus"></i> Add experience
          </button>
        </div>
      </div>
    </div>
    <!-- progress-wrapper -->
  </div>
</div>
